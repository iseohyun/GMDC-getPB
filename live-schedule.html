<!DOCTYPE html>
<html lang="ko">

<head>

  <script>
    // SPA 단일 주소 리다이렉트 (최상위 창으로 열렸을 때 index.html#/해시 로 자동 전환)
    (function() {
      if (window.self === window.top) {
        const file = window.location.pathname.split('/').pop();
        const search = new URLSearchParams(window.location.search);
        let hash = '#/training-attendance';

        if (file === 'student-member.html' || file === 'student.html') {
          hash = search.get('view') === 'records' ? '#/roster-student-relay' : '#/roster-student-indiv';
        } else if (file === 'adult-member.html') {
          hash = search.get('view') === 'records' ? '#/roster-adult-relay' : '#/roster-adult-indiv';
        } else if (file === 'attendance.html') {
          hash = '#/training-attendance';
        } else if (file === 'training_calendar.html') {
          hash = '#/training-calendar';
        } else if (file === 'meeting_notes.html') {
          hash = '#/training-meeting';
        } else if (file === 'prospectus.html') {
          hash = '#/competition-prospectus';
        } else if (file === 'live-schedule.html') {
          hash = search.get('div') === 'student' ? '#/competition-live-student' : '#/competition-live-adult';
        } else if (file === 'admin.html') {
          hash = '#/admin-settings';
        }

        window.location.replace('index.html' + hash);
      }
    })();
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5H98EB7ZSP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5H98EB7ZSP');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>⏱️ 실시간 대회 대진표 & 경기 순서 - GMDC 거제오션</title>
  <meta name="description" content="2026년 제19회 거제시장배 전국마스터즈 수영대회 당일 실시간 경기 순서 및 예상 시작 시각">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
  <link rel="stylesheet" href="style.css?v=20261024_16">
  <link rel="stylesheet" href="live-schedule.css?v=20261024_16">
  
  <style>
    /* Iframe 임베드 및 세로 스크롤 최적화 (sticky/fixed 호환) */
    html {
      margin: 0 !important;
      padding: 0 !important;
      height: auto !important;
      min-height: 100% !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      background-color: var(--bg-page, #f8fafc) !important;
    }
    body {
      margin: 0 !important;
      padding: 0 !important;
      height: auto !important;
      min-height: 100% !important;
      overflow: visible !important;
      background-color: var(--bg-page, #f8fafc) !important;
    }
    body.with-sidebar {
      padding-left: 0 !important;
    }
    .gmdc-sidebar, #sidebarBackdrop, .btn-mobile-sidebar-toggle {
      display: none !important;
    }
    .app-container {
      max-width: 100% !important;
      padding: 10px 14px !important;
      margin: 0 !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
  </style>

  <link rel="stylesheet" href="sidebar.css?v=20261024_03">
</head>

<body>
  <div class="app-container">
    <div class="live-main" id="liveMainContainer">
      <!-- Compact Realtime Controller Card -->
      <section class="live-controller-card" id="liveControllerCard">
        <!-- 1행: [현재순번] [현재 종목] [평균 경기 진행속도] [현재 경기로 이동] [휴게 시작] [자동갱신여부] [갱신대기시간(초)][즉시 새로고침 아이콘] -->
        <div class="ctrl-row-top">
          <span class="ctrl-current-no" id="ctrlCurrentNo" title="클릭 시 현재 진행 순번으로 스크롤 이동">대기</span>
          <span class="ctrl-current-event" id="ctrlCurrentEvent">경기가 아직 시작되지 않았습니다</span>
          <span class="ctrl-pace-info" id="ctrlPaceInfo" title="완료된 경기 기준 평균 소요시간 (기본: 개인 01:15 / 단체전 03:00)">평균 경기 진행속도:(01:15)(단체전:03:00)</span>

          <div class="ctrl-sync-group">
            <button type="button" class="ctrl-action-btn ctrl-btn-download-all" id="btnDownloadAllScheduleImage" title="전체 출전 경기 대진표를 이미지(PNG)로 다운로드합니다">🖼️ 전체 대진표 저장</button>
            <button type="button" class="ctrl-action-btn ctrl-btn-download-img" id="btnDownloadOurTeamImage" title="우리팀(거제몽꾸·거제야르) 출전 경기만 모아 고화질 이미지(PNG)로 다운로드합니다">🖼️ 우리팀 대진표 저장</button>
            <button type="button" class="ctrl-action-btn ctrl-btn-goto" id="btnScrollCurrentRace" title="현재 진행 중인 경기로 스크롤 이동">📍 현재 경기</button>
            <button type="button" class="ctrl-action-btn ctrl-btn-break" id="btnStartBreak" title="현재 순서 다음에 녹색 휴게 카드를 추가하고 휴게를 시작합니다">☕ 휴게 시작</button>
            <button type="button" class="ctrl-icon-btn active" id="btnAutoRefreshToggle" title="자동 갱신 켜기/끄기">
              <span id="iconAutoRefresh">🔁</span>
            </button>
            <span class="ctrl-countdown-badge" id="countdownBadge" title="다음 자동 갱신까지 남은 시간(초)">10s</span>
            <button type="button" class="ctrl-icon-btn" id="btnManualRefresh" title="즉시 새로고침">🔄</button>
          </div>
        </div>

        <!-- 2행: [검색창] 검색창에 우리 팀(거제몽꾸/거제야르) 및 선수들 이름을 추천해줌 -->
        <div class="ctrl-row-search">
          <div class="ctrl-search-box" id="ctrlSearchBox">
            <span class="ctrl-search-icon">🔍</span>
            <input type="text" id="inputSearchSwimmer" placeholder="거제몽꾸·거제야르·선수 이름 또는 순번·종목 검색 (클릭 시 추천)" autocomplete="off">
            <button type="button" class="ctrl-btn-clear" id="btnClearSearch" style="display: none;" title="검색어 지우기">✕</button>
            <div class="swimmer-suggest-dropdown" id="swimmerSuggestDropdown" style="display: none;"></div>
          </div>
        </div>
      </section>

      <!-- Races Timeline List -->
      <section class="live-races-container" id="racesListContainer">
        <div class="loading-placeholder">대진표 데이터를 불러오는 중입니다...</div>
      </section>
    </div>

    <!-- 학생 정보 모달 팝업 (증명사진 + 전화번호 클립보드 복사) -->
    <div class="student-modal-overlay" id="studentInfoModal" style="display: none;">
      <div class="student-modal-card">
        <button type="button" class="student-modal-close" id="btnCloseStudentModal" aria-label="닫기">✕</button>
        <div class="student-photo-wrap">
          <img id="modalStudentPhoto" src="" alt="학생 증명사진">
        </div>
        <div class="student-info-body">
          <div class="student-name-line">
            <strong id="modalStudentName">-</strong>
            <span class="student-meta-badge" id="modalStudentMeta">-</span>
          </div>
          <button type="button" class="btn-copy-phone" id="btnCopyStudentPhone" title="클릭하여 전화번호 복사">
            <span class="phone-icon">📞</span>
            <span class="phone-text" id="modalStudentPhone">010-0000-0000</span>
            <span class="copy-hint" id="modalCopyHint">📋 복사</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="live-toast-bar" id="liveToastBar" style="display: none;">
      <span class="toast-message" id="toastMessage">처리되었습니다.</span>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="live-schedule.js?v=20261024_16"></script>
  <script type="module" src="sidebar.js?v=20261024_16"></script>
</body>
</html>
