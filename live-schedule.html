<!DOCTYPE html>
<html lang="ko">

<head>

  <script>
    // SPA 단일 주소 리다이렉트 (최상위 창으로 열렸을 때 index.html#/해시 로 자동 전환)
    (function() {
      if (window.self === window.top) {
        const file = window.location.pathname.split('/').pop();
        const search = new URLSearchParams(window.location.search);
        let hash = '#/training-attendance';

        if (file === 'student-member.html' || file === 'student.html') {
          hash = search.get('view') === 'records' ? '#/roster-student-relay' : '#/roster-student-indiv';
        } else if (file === 'adult-member.html') {
          hash = search.get('view') === 'records' ? '#/roster-adult-relay' : '#/roster-adult-indiv';
        } else if (file === 'attendance.html') {
          hash = '#/training-attendance';
        } else if (file === 'training_calendar.html') {
          hash = '#/training-calendar';
        } else if (file === 'meeting_notes.html') {
          hash = '#/training-meeting';
        } else if (file === 'prospectus.html') {
          hash = '#/competition-prospectus';
        } else if (file === 'live-schedule.html') {
          hash = search.get('div') === 'student' ? '#/competition-live-student' : '#/competition-live-adult';
        } else if (file === 'admin.html') {
          hash = '#/admin-settings';
        }

        window.location.replace('index.html' + hash);
      }
    })();
  </script>

  <!-- Google tag (gtag.js) -->

  </script>

  <title>⏱️ 실시간 대회 대진표 & 경기 순서 추론 - GMDC 거제오션</title>
  <meta name="description" content="2026년 제19회 거제시장배 전국마스터즈 수영대회 당일 실시간 경기 순서 및 예상 시작 시각">

  <style>
    /* Iframe 임베드 최적화 */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: var(--bg-page, #f8fafc) !important;
    }
    body.with-sidebar {
      padding-left: 0 !important;
    }
    .gmdc-sidebar, #sidebarBackdrop, .btn-mobile-sidebar-toggle {
      display: none !important;
    }
    .header-auth-area, #headerAuthArea, #btnGoogleLogin,
    .header-date, #tableDateBadge,
    .btn-rules-header, #btnOpenRulesModal,
    .header-view-toggle, .division-nav {
      display: none !important;
    }
    .app-container {
      max-width: 100% !important;
      padding: 16px 20px !important;
      margin: 0 !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .combo-condition-help {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #e2e8f0;
      color: #334155;
      font-size: 11.5px;
      font-weight: 800;
      cursor: help;
      margin-left: 6px;
      vertical-align: middle;
      transition: all 0.2s;
    }

      transform: scale(1.1);

<body>
  <div class="app-container">
    <!-- Main Top Header -->
    <!-- Current Race Banner -->
        <div class="current-race-banner" id="currentRaceBanner">
          <div class="banner-top-meta">
            <span class="badge-current-tag" id="bannerTag">현재 진행 순번</span>
            <span class="banner-pace-info" id="bannerPaceInfo">속도 계수: 1.0x (정상 속도 진행 중)</span>
          </div>
          <div class="banner-title-line">
            <span class="banner-match-no" id="bannerMatchNo">-</span>
            <h2 class="banner-match-title" id="bannerMatchTitle">대회가 아직 시작되지 않았습니다.</h2>
          </div>
          <div class="banner-timer-line">
            <div class="timer-item">
              <span class="timer-label">출발 시각</span>
              <strong class="timer-val" id="bannerStartTime">-</strong>
            </div>
            <div class="timer-item">
              <span class="timer-label">경과 시간</span>
              <strong class="timer-val highlight" id="bannerElapsedTime">-</strong>
            </div>
            <div class="timer-item" id="pauseTimeBox" style="display: none;">
              <span class="timer-label">휴게 시간</span>
              <strong class="timer-val pause-highlight" id="bannerPauseTime">00:00</strong>
            </div>
          </div>
        </div>

        <!-- Action Control Buttons (Anyone can operate, with safety protection) -->
        <div class="controller-action-row">
          <button type="button" class="btn-action-primary" id="btnNextRace">
            <span class="btn-icon">⏭</span>
            <span class="btn-text" id="btnNextRaceText">다음 조 시작 (Next)</span>
          </button>

          <button type="button" class="btn-action-pause" id="btnTogglePause">
            <span class="btn-icon">☕</span>
            <span class="btn-text" id="btnTogglePauseText">휴게 시작</span>
          </button>

          <button type="button" class="btn-action-undo" id="btnUndoAction" title="실수로 다음을 눌렀을 때 직전 조로 되돌립니다">
            <span class="btn-icon">↩</span>
            <span class="btn-text">이전 조로 (Undo)</span>
          </button>

          <div class="jump-control-group">
            <select id="selJumpRace" class="sel-jump-race" title="특정 조 번호로 강제 이동">
              <option value="">조 번호로 이동 ▾</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Search & Filters Bar (Fast Navigation) -->
      <section class="live-filter-section">
        <div class="filter-top-row">
          <!-- Our Team Toggle -->
          <button type="button" class="btn-our-team-filter" id="btnOurTeamOnly" data-active="false">
            <span class="star-icon">⭐</span>
            <span id="txtOurTeamFilter">우리 팀 경기만 보기</span>
            <span class="our-team-count-badge" id="ourTeamCountBadge">0</span>
          </button>

          <!-- Search Input -->
          <div class="search-input-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="inputSearchSwimmer" placeholder="선수명 또는 소속 검색 (예: 이서현, 거제야르)" autocomplete="off">
            <button type="button" class="btn-clear-search" id="btnClearSearch" style="display: none;">✕</button>
          </div>
        </div>

        <!-- Stroke Pills -->
        <div class="stroke-pills-bar" id="strokePillsBar">
          <button type="button" class="stroke-pill active" data-stroke="all">전체</button>
          <button type="button" class="stroke-pill" data-stroke="핀접영">핀접영</button>
          <button type="button" class="stroke-pill" data-stroke="배영">배영</button>
          <button type="button" class="stroke-pill" data-stroke="계영">계영</button>
          <button type="button" class="stroke-pill" data-stroke="접영">접영</button>
          <button type="button" class="stroke-pill" data-stroke="핀자유형">핀자유형</button>
          <button type="button" class="stroke-pill" data-stroke="평영">평영</button>
          <button type="button" class="stroke-pill" data-stroke="혼계영">혼계영</button>
          <button type="button" class="stroke-pill" data-stroke="자유형">자유형</button>
          <button type="button" class="stroke-pill" data-stroke="혼성핀계영">혼성핀계영</button>
        </div>

        <!-- Gender & Group Filters -->
        <div class="filter-sub-row">
          <div class="sub-filter-group">
            <label>성별:</label>
            <select id="selGenderFilter">
              <option value="all">전체</option>
              <option value="남자">남자</option>
              <option value="여자">여자</option>
              <option value="혼성">혼성</option>
            </select>
          </div>

          <div class="sub-filter-group">
            <label>그룹:</label>
            <select id="selGroupFilter">
              <option value="all">전체 그룹</option>
            </select>
          </div>

          <span class="filter-result-count" id="filterResultCount">전체 141개 중 141개 표시</span>
        </div>
      </section>

      <!-- Races Timeline List -->
      <section class="live-races-container" id="racesListContainer">
        <!-- Dynamically rendered by live-schedule.js -->
        <div class="loading-placeholder">대진표 및 실시간 진행 데이터를 불러오는 중입니다...</div>
      </section>

    </div>

    <!-- Floating Action Button: "최신 진행 위치로 이동" -->
    <button type="button" class="btn-floating-scroll-current" id="btnScrollToCurrent" style="display: none;" title="현재 진행 중인 조로 스크롤 이동하고 자동 갱신을 다시 켭니다">
      <span class="fab-icon">⬇️</span>
      <span class="fab-text" id="fabCurrentRaceText">진행 중인 조로 이동</span>
    </button>

    <!-- Toast Notification (Undo Support) -->
    <div class="live-toast-bar" id="liveToastBar" style="display: none;">
      <span class="toast-message" id="toastMessage">다음 조가 시작되었습니다.</span>
      <button type="button" class="btn-toast-undo" id="btnToastUndo">↩ 실행 취소</button>
    </div>

  </div>

  <!-- Scripts -->
  <script type="module" src="live-schedule.js?v=20261023_10"></script>
