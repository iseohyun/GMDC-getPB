<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>거제시장배 2026 - GMDC 거제오션 수영클럽</title>
  <meta name="description" content="2026년 제19회 거제시장배 전국마스터즈 수영대회 통합 포털">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" media="print" onload="this.media='all'">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏊</text></svg>">
  <link rel="stylesheet" href="style.css?v=20261024_19">
  <link rel="stylesheet" href="sidebar.css?v=20261024_19">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
    }
    .spa-shell-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .spa-embedded-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #f8fafc;
    }
    /* Mobile Top App Bar for Hamburger */
    .spa-mobile-header {
      display: none;
      height: 52px;
      background: #0f172a;
      color: #ffffff;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 100;
    }
    .spa-mobile-header .btn-mobile-menu-trigger {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .spa-mobile-header .mobile-app-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spa-mobile-header-actions {
      margin-left: auto;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .spa-mobile-header-actions.is-visible {
      display: inline-flex;
    }
    .btn-mobile-header-icon {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.15s ease;
    }
    .btn-mobile-header-icon:hover {
      background: rgba(51, 65, 85, 0.95);
      color: #ffffff;
    }
    .btn-mobile-header-icon.is-active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.28);
    }
    .btn-mobile-header-icon.is-edit-active {
      background: #ea580c;
      border-color: #fdba74;
      color: #ffffff;
      box-shadow: 0 0 0 2px rgba(251, 146, 60, 0.32);
    }
    .btn-mobile-header-icon .icon-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #38bdf8;
      display: none;
    }
    .btn-mobile-header-icon.has-indicator .icon-dot {
      display: block;
    }
    @media (max-width: 900px) {
      .spa-mobile-header {
        display: flex;
      }
      .spa-embedded-frame {
        height: calc(100vh - 52px);
      }
    }
  </style>
</head>

<body class="with-sidebar">
  <div class="spa-shell-container">
    <!-- Mobile Hamburger Bar -->
    <header class="spa-mobile-header">
      <button type="button" class="btn-mobile-menu-trigger" id="btnMobileMenuTrigger" aria-label="메뉴 열기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <span class="mobile-app-title">🏊 거제시장배 2026</span>
      <div class="spa-mobile-header-actions" id="spaMobileHeaderActions">
        <button type="button" class="btn-mobile-header-icon" id="btnMobileHdrCols" data-records-header-cmd="columns" title="열설정" aria-label="열설정">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="15" y1="3" x2="15" y2="21"></line>
          </svg>
          <span class="icon-dot"></span>
        </button>
        <button type="button" class="btn-mobile-header-icon" id="btnMobileHdrFilter" data-records-header-cmd="filter" title="필터" aria-label="필터">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          <span class="icon-dot"></span>
        </button>
        <button type="button" class="btn-mobile-header-icon" id="btnMobileHdrSearch" data-records-header-cmd="search" title="검색" aria-label="검색">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span class="icon-dot"></span>
        </button>
        <button type="button" class="btn-mobile-header-icon" id="btnMobileHdrEdit" data-records-header-cmd="toggle-edit" title="기록 수정모드 (관리자 전용)" aria-label="기록 수정모드" style="display: none;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Embedded View Frame -->
    <iframe id="spaFrame" class="spa-embedded-frame" title="GMDC 메인 콘텐츠" src="about:blank"></iframe>
  </div>

  <script type="module" src="sidebar.js?v=20261026_15"></script>
  <script>
    // 모바일 헤더 햄버거 메뉴 연결
    document.addEventListener('DOMContentLoaded', () => {
      const trigger = document.getElementById('btnMobileMenuTrigger');
      trigger?.addEventListener('click', () => {
        const toggle = document.getElementById('btnMobileSidebarToggle');
        if (toggle) toggle.click();
        else {
          document.getElementById('gmdcSidebar')?.classList.add('mobile-open');
          document.getElementById('sidebarBackdrop')?.classList.add('active');
        }
      });
    });
  </script>
</body>
</html>
