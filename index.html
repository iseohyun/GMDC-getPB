  <meta charset="UTF-8">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>거제시장배 2026 - GMDC 거제오션 수영클럽</title>
  <meta name="description" content="2026년 제19회 거제시장배 전국마스터즈 수영대회 통합 포털">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" media="print" onload="this.media='all'">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏊</text></svg>">
  <link rel="stylesheet" href="style.css?v=20261024_19">
  <link rel="stylesheet" href="sidebar.css?v=20261024_19">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
    }
    .spa-shell-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .spa-embedded-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #f8fafc;
    }
    /* Mobile Top App Bar for Hamburger */
    .spa-mobile-header {
      display: none;
      height: 52px;
      background: #0f172a;
      color: #ffffff;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 100;
    }
    .spa-mobile-header .btn-mobile-menu-trigger {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .spa-mobile-header .mobile-app-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    @media (max-width: 900px) {
      .spa-mobile-header {
        display: flex;
      }
      .spa-embedded-frame {
        height: calc(100vh - 52px);
      }
    }
  </style>
</head>

<body class="with-sidebar">
  <div class="spa-shell-container">
    <!-- Mobile Hamburger Bar -->
    <header class="spa-mobile-header">
      <button type="button" class="btn-mobile-menu-trigger" id="btnMobileMenuTrigger" aria-label="메뉴 열기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <span class="mobile-app-title">🏊 거제시장배 2026</span>
    </header>

    <!-- Embedded View Frame -->
    <iframe id="spaFrame" class="spa-embedded-frame" title="GMDC 메인 콘텐츠" src="about:blank"></iframe>
  </div>

  <script type="module" src="sidebar.js?v=20261024_25"></script>
  <script>
    // 모바일 헤더 햄버거 메뉴 연결
    document.addEventListener('DOMContentLoaded', () => {
      const trigger = document.getElementById('btnMobileMenuTrigger');
      trigger?.addEventListener('click', () => {
        const toggle = document.getElementById('btnMobileSidebarToggle');
        if (toggle) toggle.click();
        else {
          document.getElementById('gmdcSidebar')?.classList.add('mobile-open');
          document.getElementById('sidebarBackdrop')?.classList.add('active');
        }
      });
    });
  </script>
</body>
</html>
