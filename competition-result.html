  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
  <link rel="stylesheet" href="style.css?v=20261024_11">
  <link rel="stylesheet" href="sidebar.css?v=20261024_11">
  <style>
    .comp-analysis-header {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .comp-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }

    .comp-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .comp-title-group h2 {
      font-size: 18px;
      font-weight: 900;
      color: #0f172a;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .comp-breadcrumb-badge {
      font-size: 12px;
      font-weight: 800;
      color: #0369a1;
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      padding: 4px 11px;
      border-radius: 999px;
    }

    /* 1단(부문: 학생부 -> 성인부) & 2단(접수 분석 -> 진행 요약 -> 결과 분석) 네비게이션 바 */
    .comp-nav-bars {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
    }

    .comp-div-tabs {
      display: inline-flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      gap: 6px;
    }

    .comp-div-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: #475569;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .comp-div-tab-btn.active {
      background: #ffffff;
      color: #0284c7;
      border-color: #cbd5e1;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    .tab-sub-badge {
      font-size: 11px;
      font-weight: 700;
      background: #e2e8f0;
      color: #334155;
      padding: 1px 6px;
      border-radius: 999px;
    }

    .comp-div-tab-btn.active .tab-sub-badge {
      background: #e0f2fe;
      color: #0369a1;
    }

    .comp-subcat-tabs {
      display: inline-flex;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .comp-subcat-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 15px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: #475569;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .comp-subcat-btn:hover {
      color: #0f172a;
      background: #f1f5f9;
    }

    .comp-subcat-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.28);
    }

    /* 접수 분석: 팀 필터 칩 영역 */
    .entry-team-filter-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed #e2e8f0;
    }

    .team-chips-label {
      font-size: 12px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    .team-power-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .team-power-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .team-power-chip:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .team-power-chip .chip-count {
      font-size: 11px;
      font-weight: 800;
      background: #e2e8f0;
      color: #475569;
      padding: 1px 6px;
      border-radius: 999px;
    }

    .team-power-chip.is-mongkku {
      border-color: #fdba74;
      background: #fff7ed;
      color: #c2410c;
    }

    .team-power-chip.is-yareu {
      border-color: #7dd3fc;
      background: #f0f9ff;
      color: #0369a1;
    }

    .team-power-chip.active {
      background: #0284c7 !important;
      border-color: #0284c7 !important;
      color: #ffffff !important;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.28);
    }

    .team-power-chip.active .chip-count {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    /* 참가팀 전력 비교표 & 공통 섹션 카드 스타일 */
    .team-power-section,
    .progress-card-section {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .team-power-header,
    .progress-sec-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .team-power-header h3,
    .progress-sec-header h3 {
      font-size: 15.5px;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
    }

    .progress-sec-sub {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
    }

    .btn-toggle-section {
      padding: 5px 12px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .team-power-row {
      cursor: pointer;
      transition: background 0.14s ease;
    }

    .team-power-row:hover {
      background: #f0f9ff !important;
    }

    .team-power-row.row-team-mongkku {
      background: #fff7ed !important;
    }

    .team-power-row.row-team-mongkku td {
      background: #fff7ed;
    }

    .team-power-row.row-team-mongkku:hover,
    .team-power-row.row-team-mongkku:hover td {
      background: #ffedd5 !important;
    }

    .team-power-row.row-team-yareu {
      background: #f0f9ff !important;
    }

    .team-power-row.row-team-yareu td {
      background: #f0f9ff;
    }

    .team-power-row.row-team-yareu:hover,
    .team-power-row.row-team-yareu:hover td {
      background: #e0f2fe !important;
    }

    .team-power-row.is-selected-team-row {
      background: #e0f2fe !important;
      outline: 1.5px solid #0284c7;
    }

    .team-tag-pill {
      font-size: 10.5px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 5px;
    }

    .team-tag-pill.mongkku {
      background: #ffedd5;
      color: #c2410c;
      border: 1px solid #fdba74;
    }

    .team-tag-pill.yareu {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #7dd3fc;
    }

    .relay-count-pill {
      display: inline-block;
      background: #f1f5f9;
      color: #0f172a;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 5px;
      border: 1px solid #cbd5e1;
    }

    .relay-events-sub {
      color: #64748b;
      font-size: 11.5px;
    }

    /* 전체 선수 명단 종목 칩 스타일 */
    .comp-ev-cell {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .comp-ev-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
    }

    .ev-pill-fin-free { background: #ecfeff; color: #0e7490; border: 1px solid #a5f3fc; }
    .ev-pill-fin-fly  { background: #f3e8ff; color: #7e22ce; border: 1px solid #d8b4fe; }
    .ev-pill-free     { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .ev-pill-back     { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .ev-pill-breast   { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .ev-pill-fly      { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }

    .comp-ev-meta {
      font-size: 11.5px;
      font-weight: 600;
      color: #64748b;
    }

    .comp-team-badge-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .comp-team-badge-btn:hover {
      border-color: #0284c7;
      color: #0284c7;
    }

    .comp-team-badge-btn.team-badge-mongkku {
      background: #fff7ed;
      color: #c2410c;
      border-color: #fdba74;
    }

    .comp-team-badge-btn.team-badge-yareu {
      background: #f0f9ff;
      color: #0369a1;
      border-color: #7dd3fc;
    }

    /* ─── 진행 요약 (학생부) 전용 시각화 & 표 스타일 ────────────────────── */
    .kpi-grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .kpi-stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-stat-card.highlight-blue {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      border-color: #bae6fd;
    }

    .kpi-stat-card.highlight-emerald {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border-color: #bbf7d0;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 800;
      color: #475569;
    }

    .kpi-value {
      font-size: 20px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .kpi-sub {
      font-size: 11.5px;
      font-weight: 600;
      color: #64748b;
    }

    /* 타임라인 가로 스택 바 */
    .timeline-ratio-wrap {
      margin-bottom: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .timeline-ratio-title {
      font-size: 12px;
      font-weight: 800;
      color: #334155;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    .timeline-ratio-bar {
      display: flex;
      height: 30px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
    }

    .tl-seg {
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
      padding: 0 4px;
    }

    .tl-seg.seg-morning  { background: #0284c7; }
    .tl-seg.seg-break1   { background: #10b981; }
    .tl-seg.seg-afternoon{ background: #2563eb; }
    .tl-seg.seg-break2   { background: #059669; }
    .tl-seg.seg-relay    { background: #7c3aed; }

    .timeline-legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: #475569;
    }

    .tl-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 4px;
    }

    /* 가로형 막대그래프 (영법별, 그룹별, 성별 비교) */
    .charts-two-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .hbar-chart-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
    }

    .hbar-chart-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hbar-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hbar-row {
      display: grid;
      grid-template-columns: 115px 1fr 96px;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
    }

    .hbar-label {
      font-weight: 800;
      color: #1e293b;
      white-space: nowrap;
    }

    .hbar-track {
      height: 22px;
      background: #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .hbar-fill {
      height: 100%;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      transition: width 0.3s ease;
    }

    .hbar-val {
      text-align: right;
      font-weight: 800;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      position: relative;
      z-index: 3;
    }

    /* 그룹 × 영법 세로 그룹 막대그래프 */
    .group-stroke-vchart-wrap {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .vchart-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .vchart-legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
    }

    .vchart-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(95px, 1fr));
      gap: 10px;
      align-items: end;
      min-height: 210px;
      padding-top: 24px;
      border-bottom: 2px solid #cbd5e1;
      overflow-x: auto;
    }

    .vchart-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .vchart-bars-cluster {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 165px;
      width: 100%;
      padding: 0 4px;
    }

    .vbar-item {
      flex: 1;
      max-width: 18px;
      border-radius: 4px 4px 0 0;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .vbar-item .vbar-num {
      position: absolute;
      top: -16px;
      font-size: 10px;
      font-weight: 800;
      color: #334155;
      white-space: nowrap;
    }

    .vchart-col-footer {
      text-align: center;
      padding-top: 6px;
    }

    .vchart-grp-title {
      font-size: 12.5px;
      font-weight: 800;
      color: #0f172a;
      display: block;
    }

    .vchart-grp-avg {
      font-size: 11px;
      font-weight: 800;
      color: #0284c7;
      background: #e0f2fe;
      padding: 1px 6px;
      border-radius: 999px;
      display: inline-block;
      margin-top: 2px;
    }

    /* 매트릭스 셀 강조 */
    .dur-cell-fast {
      background: #eff6ff !important;
      color: #1d4ed8 !important;
      font-weight: 800 !important;
    }

    .dur-cell-slow {
      background: #fff1f2 !important;
      color: #be123c !important;
      font-weight: 800 !important;
    }

    .dur-cell-avg {
      background: #f8fafc !important;
      color: #0f172a !important;
      font-weight: 900 !important;
    }

    /* 추후 업데이트 예정 안내 카드 */
    .pending-update-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 56px 24px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
      margin-top: 8px;
    }

    .pending-icon {
      font-size: 46px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .pending-title {
      font-size: 20px;
      font-weight: 900;
      color: #0f172a;
      margin: 0 0 8px 0;
    }

    .pending-desc {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      max-width: 520px;
      margin: 0 auto 20px auto;
      line-height: 1.6;
    }

    .pending-Quick-btns {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-quick-nav {
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f172a;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .btn-quick-nav.primary {
      background: #0284c7;
      border-color: #0284c7;
      color: #ffffff;
    }

    /* ─── 결과 분석 (학생부 공식 기록지 기반) 전용 스타일 ───────────────── */
    .kpi-stat-card.highlight-amber {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border-color: #fcd34d;
    }

    .kpi-stat-card.highlight-purple {
      background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
      border-color: #d8b4fe;
    }

    .result-rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      min-width: 52px;
    }

    .result-rank-badge.rank-1 {
      background: linear-gradient(135deg, #fef08a 0%, #facc15 100%);
      color: #713f12;
      border: 1px solid #eab308;
      box-shadow: 0 1px 4px rgba(234, 179, 8, 0.25);
    }

    .result-rank-badge.rank-2 {
      background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
      color: #1e293b;
      border: 1px solid #94a3b8;
    }

    .result-rank-badge.rank-3 {
      background: linear-gradient(135deg, #ffedd5 0%, #fdba74 100%);
      color: #7c2d12;
      border: 1px solid #fb923c;
    }

    .result-rank-badge.rank-top6 {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #7dd3fc;
    }

    .result-rank-badge.rank-normal {
      background: #f8fafc;
      color: #475569;
      border: 1px solid #e2e8f0;
    }

    .result-rank-badge.rank-dq {
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
    }

    .result-rank-badge.rank-dns {
      background: #f1f5f9;
      color: #94a3b8;
      border: 1px solid #cbd5e1;
    }

    .result-rank-badge.rank-unverified {
      background: #f8fafc;
      color: #64748b;
      border: 1px dashed #cbd5e1;
    }

    .result-pts-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 900;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .result-pts-pill.is-zero {
      background: transparent;
      color: #cbd5e1;
      border-color: transparent;
      font-weight: 600;
    }

    .our-team-row-highlight {
      background: #f0f9ff !important;
    }

    .our-team-row-highlight:hover {
      background: #e0f2fe !important;
    }

    .result-filter-pills {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
    }

    .result-filter-pill {
      padding: 6px 12px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: #475569;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .result-filter-pill.active {
      background: #ffffff;
      color: #0284c7;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.1);
    }

    .podium-grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .podium-spot-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 13px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }

    .podium-spot-card.is-gold {
      background: linear-gradient(135deg, #fefce8 0%, #ffffff 100%);
      border-color: #fde047;
    }

    .podium-spot-card.is-silver {
      background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
      border-color: #cbd5e1;
    }

    .podium-spot-card.is-bronze {
      background: linear-gradient(135deg, #fff7ed 0%, #ffffff 100%);
      border-color: #fdba74;
    }

    .podium-spot-card.is-top6 {
      background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 100%);
      border-color: #bae6fd;
    }

    /* 막대그래프 내부 문구 1줄 강제 출력 (막대 밖으로 뚫고 나가도 잘리지 않게 처리) */
    .hbar-track.allow-overflow {
      overflow: visible !important;
      position: relative;
      min-width: 0;
    }

    .hbar-track.allow-overflow .hbar-fill {
      box-sizing: border-box;
      white-space: nowrap !important;
      word-break: keep-all !important;
      overflow: visible !important;
      justify-content: flex-start !important;
      padding-left: 10px;
      padding-right: 0;
      text-shadow: 0 1px 3px rgba(15, 23, 42, 0.85), 0 0 2px rgba(15, 23, 42, 0.95);
    }

    .hbar-bar-text {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: max-content;
      white-space: nowrap !important;
      word-break: keep-all !important;
      line-height: 1;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      z-index: 2;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(15, 23, 42, 0.9), 0 0 2px rgba(15, 23, 42, 0.95);
    }

    /* 영법별 1위 기록 꺾은선 그래프 2x2 그리드 (좌상: 접영, 우상: 배영, 좌하: 평영, 우하: 자유형) */
    .stroke-linecharts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .stroke-linechart-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stroke-linechart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    .stroke-linechart-title {
      font-size: 14px;
      font-weight: 900;
      color: #0f172a;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stroke-linechart-legend {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      font-weight: 800;
      color: #475569;
    }

    .line-legend-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .stroke-svg-wrap {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 6px 4px;
      box-sizing: border-box;
    }

    .stroke-svg-wrap svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    /* 원문 데이터 테이블 표시 열 선택 바 */
    .col-toggle-bar {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .col-toggle-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .col-toggle-label {
      font-size: 12px;
      font-weight: 900;
      color: #334155;
      margin-right: 4px;
      white-space: nowrap;
    }

    .col-toggle-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: all 0.14s ease;
    }

    .col-toggle-chip input[type="checkbox"] {
      margin: 0;
      accent-color: #0284c7;
      cursor: pointer;
    }

    .col-toggle-chip.is-checked {
      background: #e0f2fe;
      border-color: #7dd3fc;
      color: #0369a1;
      font-weight: 800;
    }

    .col-toggle-presets {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .col-preset-btn {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }

    .col-preset-btn:hover {
      border-color: #0284c7;
      color: #0284c7;
    }

    .col-preset-btn.is-active-sort {
      background: #0284c7;
      border-color: #0284c7;
      color: #ffffff;
    }

    .col-preset-btn.is-active-sort:hover {
      background: #0369a1;
      border-color: #0369a1;
      color: #ffffff;
    }

    .th-sortable-record {
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .th-sortable-record:hover {
      background: #e0f2fe !important;
      color: #0369a1 !important;
    }

    .th-sortable-record.is-sorted {
      background: #e0f2fe !important;
      color: #0284c7 !important;
    }

    /* ─── 기록지DB 전용: 상단 Sticky 아이콘 바 & 1개씩만 열리는 개별 패널(열설정/필터/검색) & Sticky 테이블 ─── */
    body.is-records-db-mode {
      padding-top: 8px !important;
      padding-bottom: 8px !important;
    }

    body.is-records-db-mode .app-container {
      padding-top: 0 !important;
      gap: 8px !important;
    }

    .records-db-page-section {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    .records-db-sticky-shell {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1.5px solid #cbd5e1;
      border-radius: 14px 14px 0 0;
      padding: 8px 14px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }

    .records-db-sticky-shell.is-empty-shell {
      padding: 0;
      border-bottom: none;
      box-shadow: none;
    }

    /* 데스크톱 또는 단독 페이지 실행 시 상단 '🏊 거제시장배 2026' + 우측 아이콘 바 */
    .records-db-desktop-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 36px;
    }

    .records-db-brand-title {
      font-size: 14.5px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.02em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .records-db-icon-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .btn-records-top-icon {
      position: relative;
      height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-records-top-icon:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .btn-records-top-icon.is-active {
      background: #0284c7;
      border-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.25);
    }

    .btn-records-top-icon.is-edit-active {
      background: #ea580c;
      border-color: #ea580c;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(234, 88, 12, 0.28);
    }

    .btn-records-top-icon .icon-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #0284c7;
      display: none;
    }

    .btn-records-top-icon.is-active .icon-dot {
      background: #ffffff;
    }

    .btn-records-top-icon.has-indicator .icon-dot {
      display: inline-block;
    }

    .btn-records-top-icon .col-edit-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 18px;
      padding: 0 6px;
      border-radius: 999px;
      background: #0284c7;
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .btn-records-top-icon.is-active .col-edit-badge {
      background: #ffffff;
      color: #0284c7;
    }

    .record-table th.th-dynamic-rank {
      color: #0284c7 !important;
      background: #f0f9ff !important;
    }

    /* 개별 패널(열설정 / 필터 / 검색): 한 번에 1개만 노출 */
    .records-db-single-panel {
      display: none;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
    }

    .records-db-single-panel.is-open {
      display: block;
    }

    .records-db-single-panel .col-toggle-bar {
      margin-bottom: 0;
    }

    .records-db-single-panel .toolbar {
      margin-bottom: 0 !important;
    }

    .records-db-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .records-db-panel-title {
      font-size: 12.5px;
      font-weight: 900;
      color: #0f172a;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-records-panel-close {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #475569;
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-records-panel-close:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .records-db-admin-edit-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      padding: 7px 12px;
      border-radius: 8px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #9a3412;
      font-size: 12px;
      font-weight: 800;
    }

    /* 종목 헤더 클릭 단축 토글 (종목 <-> 종목*) */
    .record-table th.th-clickable-stroke {
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .record-table th.th-clickable-stroke:hover {
      background: #e0f2fe !important;
      color: #0369a1 !important;
    }

    .record-table th.th-clickable-stroke.is-short-mode {
      color: #0284c7;
      background: #f0f9ff !important;
    }

    /* 이름 셀 줄바꿈 규칙 (개인 4글자 단위 줄바꿈 / 단체 콤마 뒤 줄바꿈) */
    .td-swimmer-name {
      white-space: nowrap;
      word-break: keep-all;
      line-height: 1.35;
    }

    .records-db-table-scroll {
      max-height: calc(100dvh - var(--records-sticky-offset, 70px));
      overflow-x: auto;
      overflow-y: auto;
      border-radius: 0 0 14px 14px;
    }

    .records-db-table-scroll .record-table th {
      position: sticky;
      top: 0;
      z-index: 25;
      background: #f1f5f9;
      box-shadow: 0 1px 0 #cbd5e1;
    }

    /* index.html 모바일 헤더(<=900px)가 실제로 표시 중인 경우에만 내부 상단 바를 숨김 (PC 모드에서는 항상 페이지 상단에 노출) */
    body.is-parent-mobile .records-db-desktop-bar {
      display: none;
    }

    body.is-parent-mobile .records-db-single-panel {
      margin-top: 0;
      padding-top: 4px;
      border-top: none;
    }

    @media (max-width: 520px) {
      .records-db-sticky-shell {
        padding: 6px 10px;
      }
      .records-db-sticky-shell.is-empty-shell {
        padding: 0;
      }
      .btn-records-top-icon .btn-icon-label {
        display: none;
      }
      .btn-records-top-icon {
        padding: 0 8px;
      }
    }

    /* ─── 스크롤 시 하단 플로팅 전체 종목 순서 네비게이터 바 ─── */
    .floating-stroke-bar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1450;
      max-width: calc(100vw - 16px);
      width: max-content;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(148, 163, 184, 0.35);
      border-radius: 999px;
      padding: 6px 10px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.38);
      display: none;
      transition: border-radius 0.18s ease, padding 0.18s ease;
    }

    .floating-stroke-bar.is-visible {
      display: block;
    }

    .floating-stroke-bar.is-expanded {
      border-radius: 16px;
      padding: 12px 12px 8px 12px;
      min-width: min(340px, calc(100vw - 20px));
    }

    /* 전체순서보기 확장 시 세로 순서도 영역 */
    .fsb-vertical-panel {
      display: none;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.32);
      max-height: 58dvh;
      overflow-y: auto;
    }

    .floating-stroke-bar.is-expanded .fsb-vertical-panel {
      display: flex;
    }

    .fsb-vert-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 900;
      color: #e2e8f0;
      padding: 0 4px 4px 4px;
    }

    .fsb-vert-step {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 7px 10px;
      border-radius: 9px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .fsb-vert-step:hover {
      border-color: #38bdf8;
      background: rgba(2, 132, 199, 0.3);
      color: #ffffff;
    }

    .fsb-vert-step.is-active {
      background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
      border-color: #fed7aa;
      color: #ffffff;
      font-weight: 900;
      box-shadow: 0 2px 10px rgba(234, 88, 12, 0.45);
    }

    .fsb-vert-step-left {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .fsb-vert-num {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.55);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .fsb-vert-step.is-active .fsb-vert-num {
      background: rgba(255, 255, 255, 0.24);
      color: #ffffff;
    }

    .fsb-vert-title {
      white-space: nowrap;
    }

    .fsb-vert-range {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .fsb-vert-step.is-active .fsb-vert-range {
      color: #ffedd5;
      font-weight: 800;
    }

    .fsb-inner {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }

    .fsb-btn-expand {
      flex-shrink: 0;
      font-size: 11.5px;
      font-weight: 900;
      color: #38bdf8;
      background: rgba(2, 132, 199, 0.22);
      border: 1px solid rgba(56, 189, 248, 0.45);
      padding: 4px 9px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .fsb-btn-expand:hover {
      background: rgba(2, 132, 199, 0.42);
      color: #ffffff;
    }

    .fsb-btn-expand.is-open {
      background: #0284c7;
      border-color: #7dd3fc;
      color: #ffffff;
    }

    .fsb-steps-track {
      display: flex;
      align-items: center;
      gap: 3px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
    }

    .fsb-steps-track::-webkit-scrollbar {
      display: none;
    }

    .fsb-step-arrow {
      color: #64748b;
      font-size: 11px;
      font-weight: 800;
      user-select: none;
      flex-shrink: 0;
    }

    .fsb-step-chip {
      flex-shrink: 0;
      border: 1px solid rgba(148, 163, 184, 0.32);
      background: rgba(30, 41, 59, 0.85);
      color: #cbd5e1;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .fsb-step-chip:hover {
      border-color: #38bdf8;
      color: #ffffff;
      background: rgba(2, 132, 199, 0.35);
    }

    .fsb-step-chip.is-past {
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.65);
      border-color: rgba(100, 116, 139, 0.25);
    }

    .fsb-step-chip.is-active {
      background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
      color: #ffffff;
      border: 1.5px solid #fed7aa;
      font-weight: 900;
      font-size: 12px;
      padding: 4px 10px;
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.35), 0 2px 8px rgba(234, 88, 12, 0.5);
    }

    .fsb-btn-close {
      flex-shrink: 0;
      margin-left: 2px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(51, 65, 85, 0.85);
      color: #f1f5f9;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .fsb-btn-close:hover {
      background: #dc2626;
      border-color: #fca5a5;
      color: #ffffff;
    }

    /* ─── 성인부 결과 분석: 팀별 세로 순위 막대그래프 & 실시간 기록 입력 스타일 ─── */
    .adult-sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #475569;
    }

    .adult-sync-badge.is-synced {
      background: #f0fdf4;
      border-color: #86efac;
      color: #15803d;
    }

    .adult-sync-badge.is-syncing {
      background: #fffbeb;
      border-color: #fde047;
      color: #b45309;
    }

    .adult-sync-badge.is-offline {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #64748b;
    }

    .adult-playback-bar {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .adult-playback-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-adult-play {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1.5px solid #0284c7;
      background: #0284c7;
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-adult-play:hover {
      background: #0369a1;
      border-color: #0369a1;
    }

    .btn-adult-play.is-playing {
      background: #dc2626;
      border-color: #dc2626;
    }

    .btn-adult-step {
      padding: 5px 10px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-adult-step:hover:not(:disabled) {
      border-color: #0284c7;
      color: #0284c7;
    }

    .btn-adult-step:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-adult-mp4 {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 7px;
      border: 1.5px solid #0f766e;
      background: #f0fdfa;
      color: #0f766e;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-adult-mp4:hover:not(:disabled) {
      background: #0f766e;
      color: #ffffff;
    }

    .btn-adult-mp4:disabled {
      opacity: 0.78;
      cursor: wait;
      background: #fef3c7;
      border-color: #f59e0b;
      color: #b45309;
    }

    .adult-playback-slider-wrap {
      flex: 1;
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .adult-race-slider {
      flex: 1;
      accent-color: #0284c7;
      cursor: pointer;
    }

    .adult-playback-match-info {
      font-size: 12.5px;
      font-weight: 800;
      color: #0f172a;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 7px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .adult-hbar-wrap {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .adult-hbar-scale-header {
      display: grid;
      grid-template-columns: 115px 1fr 72px;
      align-items: center;
      gap: 10px;
      padding: 0 6px 8px 6px;
      margin-bottom: 8px;
      border-bottom: 1px dashed #cbd5e1;
      font-size: 11.5px;
      font-weight: 800;
      color: #64748b;
    }

    .adult-hbar-scale-ticks {
      position: relative;
      height: 16px;
      width: 100%;
    }

    .adult-hbar-scale-tick {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: #64748b;
    }

    .adult-hbar-scale-tick.is-start {
      left: 0%;
      transform: none;
    }

    .adult-hbar-scale-tick.is-end {
      left: 100%;
      transform: translateX(-100%);
      color: #0284c7;
      font-weight: 900;
    }

    .adult-hbar-list {
      position: relative;
      width: 100%;
      transition: height 0.2s ease;
    }

    .adult-hbar-row {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 29px;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 115px 1fr 72px;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      padding: 3px 6px;
      border-radius: 7px;
      cursor: pointer;
      will-change: transform;
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.18s ease;
    }

    .adult-hbar-row:hover {
      background: #f1f5f9;
    }

    .adult-hbar-row.is-active-filter {
      background: #e0f2fe;
      outline: 1.5px solid #0284c7;
    }

    .adult-hbar-team {
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .adult-hbar-track {
      height: 22px;
      background: #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .adult-hbar-fill {
      height: 100%;
      min-width: 0;
      border-radius: 6px;
      will-change: width;
      transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1), background 0.24s ease;
    }

    .adult-hbar-list.is-raf-playing .adult-hbar-fill {
      transition: background 0.24s ease;
    }

    /* 우리팀(거제몽꾸·거제야르): 주황색 하이라이트, 다른 팀: 파란색 통일 */
    .adult-hbar-fill.is-our-orange {
      background: linear-gradient(90deg, #ea580c 0%, #f97316 100%);
    }

    .adult-hbar-fill.is-blue {
      background: linear-gradient(90deg, #1d4ed8 0%, #3b82f6 100%);
    }

    .adult-hbar-score {
      text-align: right;
      font-weight: 900;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* 성인부 대진표 초/비고 입력 인풋 */
    .adult-sec-input {
      width: 82px;
      padding: 5px 7px;
      border: 1.5px solid #cbd5e1;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      font-variant-numeric: tabular-nums;
      background: #ffffff;
      transition: border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
      box-sizing: border-box;
    }

    .adult-sec-input:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.16);
      background: #f0f9ff;
    }

    .adult-sec-input.has-value {
      border-color: #38bdf8;
      background: #f8fafc;
    }

    .adult-note-input {
      width: 100%;
      min-width: 110px;
      padding: 5px 8px;
      border: 1.5px solid #e2e8f0;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      background: #ffffff;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
      box-sizing: border-box;
    }

    .adult-note-input:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14);
    }

    .adult-note-input.is-excluded-note {
      border-color: #fda4af;
      background: #fff1f2;
      color: #be123c;
      font-weight: 800;
    }

    @media (max-width: 820px) {
      .stroke-linecharts-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .hbar-row {
        grid-template-columns: 95px 1fr 84px;
        font-size: 11.5px;
      }
      .vchart-grid {
        grid-template-columns: repeat(7, minmax(82px, 1fr));
      }
    }
  </style>
</head>

<body>
  <div class="app-container" style="padding-top: 16px;">

    <!-- 상단 공통 헤더: 현재 페이지 제목 및 경로 표시 -->
    <section class="comp-analysis-header">
      <div class="comp-top-row" style="margin-bottom: 0;">
        <div class="comp-title-group">
          <h2 id="pageMainHeading">🏆 2026 제19회 거제시장배 대회결과</h2>
          <span class="comp-breadcrumb-badge" id="pageBreadcrumbBadge">대회결과 &gt; 학생부 &gt; 접수 분석</span>
        </div>
      </div>

      <!-- 접수 분석 전용: 팀별 전력 필터 칩 -->
      <div class="entry-team-filter-box" id="entryTeamFilterBox">
        <div class="team-chips-label">
          <span>🎯 팀별 전력 필터 (클릭 시 아래 그래프·표·명단이 해당 팀 또는 전체로 즉시 전환됩니다)</span>
        </div>
        <div class="team-power-chips-wrap" id="teamFilterChips">
          <!-- Rendered by competition-result.js -->
        </div>
      </div>
    </section>

    <!-- =================================================================== -->
    <!-- VIEW 1: 접수 분석 (학생부 > 접수 분석 / 성인부 > 접수 분석)           -->
    <!-- =================================================================== -->
    <div id="viewContainerEntry">
      <!-- 1-1. 연령대(그룹)·성별·종목 출전 요약 섹션 (기본: 누적 막대그래프 / 전환: 요약 표) -->
      <section class="events-summary-section">
        <div class="events-summary-topbar">
          <div class="events-summary-title-wrap">
            <h3 class="events-summary-main-title" id="summarySectionTitle">📊 개인전 출전 요약</h3>
            <div class="summary-chart-legend" id="summaryChartLegend"></div>
          </div>
          <div class="events-summary-controls">
            <div class="summary-view-switch" id="summaryViewSwitch" role="group" aria-label="출전 요약 보기 전환">
              <button type="button" class="summary-switch-btn active" data-summary-view="chart">📊 그래프</button>
              <button type="button" class="summary-switch-btn" data-summary-view="table">📋 표</button>
            </div>
          </div>
        </div>

        <!-- 기본 뷰: 누적 막대그래프 -->
        <div id="summaryChartContainer" class="summary-chart-card"></div>

        <!-- 전환 뷰: 남성 / 여성 출전 요약 표 -->
        <div id="summaryTablesContainer" class="matrices-container" style="display: none;">
          <div class="matrix-card male-card">
            <div class="matrix-card-header">
              <div class="matrix-title-area">
                <span class="matrix-badge male">남성부</span>
                <h3 id="maleMatrixTitle">👨 남성 출전 요약</h3>
              </div>
              <span class="matrix-tip">💡 숫자에 마우스 오버 시 명단 확인</span>
            </div>
            <div class="table-responsive">
              <table class="summary-matrix-table" id="maleMatrixTable">
                <thead id="maleMatrixHead"></thead>
                <tbody id="maleMatrixBody"></tbody>
                <tfoot id="maleMatrixFoot"></tfoot>
              </table>
            </div>
          </div>

          <div class="matrix-card female-card">
            <div class="matrix-card-header">
              <div class="matrix-title-area">
                <span class="matrix-badge female">여성부</span>
                <h3 id="femaleMatrixTitle">👩 여성 출전 요약</h3>
              </div>
              <span class="matrix-tip">💡 숫자에 마우스 오버 시 명단 확인</span>
            </div>
            <div class="table-responsive">
              <table class="summary-matrix-table" id="femaleMatrixTable">
                <thead id="femaleMatrixHead"></thead>
                <tbody id="femaleMatrixBody"></tbody>
                <tfoot id="femaleMatrixFoot"></tfoot>
              </table>
            </div>
          </div>
        </div>
      </section>

      <!-- 1-2. 참가 팀별 전력 비교 요약표 -->
      <section class="team-power-section">
        <div class="team-power-header">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <h3>⚔️ 팀 전력 비교</h3>
            <span id="teamPowerSummaryCount" style="font-size:12.5px; color:#64748b; font-weight:700;"></span>
          </div>
          <button type="button" class="btn-toggle-section" id="btnToggleTeamPowerTable">▲ 표 접기</button>
        </div>
        <div class="table-responsive" id="teamPowerTableWrap">
          <table class="record-table" id="teamPowerTable">
            <thead id="teamPowerTableHead"></thead>
            <tbody id="teamPowerTableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- 1-3. 전체 대회 출전선수 상세 명단 -->
      <section class="events-detail-section">
        <div class="events-detail-header">
          <div class="events-detail-title-group">
            <h3 id="compSwimmersTitle">📋 전체 대회 출전선수 명단</h3>
          </div>
        </div>

        <section class="toolbar">
          <div class="toolbar-left">
            <div class="search-box">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="compSearchInput" placeholder="선수 이름 또는 소속팀 검색..." autocomplete="off">
            </div>

            <div class="filter-group">
              <select id="compTeamSelect" class="filter-select" aria-label="소속팀 필터">
                <option value="all" selected>전체 대회 출전선수</option>
              </select>
            </div>

            <div class="filter-group">
              <select id="compGenderSelect" class="filter-select" aria-label="성별 필터">
                <option value="all" selected>전체 성별</option>
                <option value="남">남자</option>
                <option value="여">여자</option>
              </select>
            </div>

            <div class="filter-group">
              <select id="compGroupSelect" class="filter-select" aria-label="그룹 필터">
                <option value="all" selected>모든 연령대(그룹)</option>
              </select>
            </div>

            <div class="filter-group">
              <select id="compStrokeSelect" class="filter-select" aria-label="종목 필터">
                <option value="all" selected>모든 종목</option>
              </select>
            </div>
          </div>
        </section>

        <main class="table-card" style="margin-top: 12px;">
          <div class="table-responsive">
            <table class="record-table events-table" id="compSwimmersTable">
              <thead>
                <tr>
                  <th style="width: 56px; text-align:center;">NO</th>
                  <th style="width: 135px; text-align:center;">소속팀</th>
                  <th style="width: 85px; text-align:center;">연령대(그룹)</th>
                  <th style="width: 65px; text-align:center;">성별</th>
                  <th style="width: 110px; text-align:center;">이름</th>
                  <th style="min-width: 210px; text-align:left;">출전 종목 1 (경기번호·레인)</th>
                  <th style="min-width: 210px; text-align:left;">출전 종목 2 (경기번호·레인)</th>
                </tr>
              </thead>
              <tbody id="compSwimmersTableBody"></tbody>
            </table>
          </div>
        </main>
      </section>
    </div>

    <!-- =================================================================== -->
    <!-- VIEW 2: 진행 요약 (학생부 > 진행 요약 / 성인부 > 진행 요약)           -->
    <!-- =================================================================== -->
    <div id="viewContainerProgress" style="display: none;"></div>

    <!-- =================================================================== -->
    <!-- VIEW 3: 결과 분석 (학생부 > 결과 분석 / 성인부 > 결과 분석)           -->
    <!-- =================================================================== -->
    <div id="viewContainerResult" style="display: none;"></div>

    <!-- =================================================================== -->
    <!-- VIEW 4: 기록지DB (학생부 > 기록지DB / 성인부 > 기록지DB)             -->
    <!-- =================================================================== -->
    <div id="viewContainerRecords" style="display: none;"></div>

    <!-- 스크롤 시 하단 플로팅 전체 종목 순서 네비게이터 바 -->
    <div class="floating-stroke-bar" id="compFloatingStrokeBar" role="region" aria-label="전체 종목 진행 순서">
      <div class="fsb-vertical-panel" id="compFloatingVerticalPanel"></div>
      <div class="fsb-inner">
        <button type="button" class="fsb-btn-expand" id="btnToggleCompFloatingVertical" aria-expanded="false" title="클릭하여 전체 종목 순서도를 세로로 펼쳐 보기">전체순서보기 ▲</button>
        <div class="fsb-steps-track" id="compFloatingStrokeSteps"></div>
        <button type="button" class="fsb-btn-close" id="btnCloseCompFloatingStrokeBar" title="전체 순서 바 닫기 (다시 스크롤하면 나타납니다)">닫기 ✕</button>
      </div>
    </div>

  </div>

  <script type="module" src="competition-result.js?v=20261026_17"></script>
  <script type="module" src="sidebar.js?v=20261026_17"></script>
</body>

</html>
