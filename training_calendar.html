              <polyline points="10 9 9 9 8 9"></polyline>

          </button>
        </div>

        <!-- Navigation Tabs (5 modules) -->
        <nav class="division-nav" aria-label="메뉴 선택">
          <a href="index.html" class="division-tab" id="attendanceTab" title="훈련 출석부 (단축키: C 또는 H)">📋 훈련 출석부</a>

    <!-- Main Content Container -->
    <main class="calendar-container">
      <!-- Interactive Month Calendar Card -->
      <section class="calendar-card">
        <div class="calendar-nav-bar">
          <!-- Left: ◀ 2026년 9월 ▶ -->
          <div class="calendar-nav-controls" id="calendarNavControls">
            <button type="button" class="btn-cal-arrow" id="btnCalPrevMonth" title="이전 달 (8월 이하 비활성화)">◀</button>
            <span class="calendar-current-month" id="calMonthTitle">2026년 9월</span>
            <button type="button" class="btn-cal-arrow" id="btnCalNextMonth" title="다음 달 (10월 이상 비활성화)">▶</button>
          </div>

          <!-- Right: 모든 월 표시 & JPG 저장 버튼 -->
          <div style="margin-left: auto; display: flex; gap: 8px; align-items: center;">
            <button type="button" class="btn-cal-all-months" id="btnToggleAllMonths" title="8월, 9월, 10월 전체 월 한 번에 보기">
              <span>📅 모든 월 표시</span>
            </button>
            <button type="button" class="btn-cal-save-jpg" id="btnSaveAsJpg" title="현재 달력 화면을 고화질 JPG 이미지 파일로 다운로드합니다">
              <span>🖼️ JPG로 저장</span>
            </button>
          </div>
        </div>

        <!-- Mount Point for Calendar Table (Single Month vs All Months) -->
        <div id="calendarMountContainer">
          <!-- Rendered dynamically via calendar.js -->
        </div>
      </section>
    </main>
